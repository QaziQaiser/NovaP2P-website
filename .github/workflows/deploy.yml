name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_LIFI_FEE: "0.015"
          VITE_VELORA_PARTNER: "nova-p2p"
          VITE_WALLETCONNECT_PROJECT_ID: "5432e3507d41270bee46b7b85bbc2ef8"

      # Optional: Auto-upload dist/ to Hostinger via FTP
      # To enable this, add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD to your GitHub Repository Secrets
      - name: Deploy to Hostinger via FTP
        if: "${{ env.FTP_SERVER != '' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
